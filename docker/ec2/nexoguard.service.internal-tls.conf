[Service]
ExecStart=
ExecStart=/usr/bin/docker compose --env-file /etc/nexoguard/public.env --env-file /run/nexoguard-host.env --env-file /etc/nexoguard/internal-web.env -f compose.production.yaml -f ../../back/docker/ec2/compose.internal-tls.yaml up -d --wait --wait-timeout 180
ExecStop=
ExecStop=/usr/bin/docker compose --env-file /etc/nexoguard/public.env --env-file /run/nexoguard-host.env --env-file /etc/nexoguard/internal-web.env -f compose.production.yaml -f ../../back/docker/ec2/compose.internal-tls.yaml stop --timeout 120
